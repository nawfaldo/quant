<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Dark glass body gradient -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#444852" />
      <stop offset="100%" stop-color="#222428" />
    </linearGradient>

    <!-- Metallic glass rim gradient: light source from top-left -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#b0b8c6" />
      <stop offset="100%" stop-color="#646c7a" />
    </linearGradient>

    <!-- Specular corner gleam -->
    <linearGradient id="cornerGleam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Background tile subtle gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#202226" />
      <stop offset="100%" stop-color="#141517" />
    </linearGradient>
  </defs>

  <!-- Background tile with subtle border -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)" stroke="#2d2f35" stroke-width="1.5" />

  <!-- Left Candle Wick (top: 13..31 = 18px, bottom: 97..115 = 18px) -->
  <line x1="39" y1="13" x2="39" y2="115" stroke="#e2e8f0" stroke-width="3.5" stroke-linecap="square" />

  <!-- Right Candle Wick (top: 35..53 = 18px, bottom: 97..115 = 18px) -->
  <line x1="89" y1="35" x2="89" y2="115" stroke="#e2e8f0" stroke-width="3.5" stroke-linecap="square" />

  <!-- Left Candle Body -->
  <rect x="23" y="31" width="32" height="66" fill="url(#bodyGrad)" stroke="url(#rimGrad)" stroke-width="2.8" stroke-linejoin="miter" />
  <!-- Left Corner Highlight -->
  <polygon points="24.4,32.4 36.5,32.4 24.4,44.5" fill="url(#cornerGleam)" />

  <!-- Right Candle Body -->
  <rect x="73" y="53" width="32" height="44" fill="url(#bodyGrad)" stroke="url(#rimGrad)" stroke-width="2.8" stroke-linejoin="miter" />
  <!-- Right Corner Highlight -->
  <polygon points="74.4,54.4 86.5,54.4 74.4,66.5" fill="url(#cornerGleam)" />
</svg>